<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuario</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding-top: 50px;
    }
    .caja-registro {
      background-color: white;
      width: 320px;
      margin: 0 auto;
      padding: 25px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    h2 {
      text-align: center;
      font-family: 'Times New Roman', serif;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input {
      width: 95%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .btn-enviar {
      width: 100%;
      background-color: #2b547e;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-regresar {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #333;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="caja-registro">
    <h2>Crear Cuenta</h2>

    <form>
      <label>Nombre completo:</label>
      <input type="text" placeholder="Tu nombre">

      <label>Nombre de usuario:</label>
      <input type="text" placeholder="Tu usuario">

      <label>Contraseña:</label>
      <input type="password" placeholder="Escribe tu contraseña">

      <button type="submit" class="btn-enviar">Registrarse</button>
    </form>
    <a href="index.html" class="btn-regresar">← Volver al inicio</a>
  </div>

</body>
</html>
